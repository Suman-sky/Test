    <style>
      * { 
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: black;
        color: white;
        min-height: 100vh;
        text-align: center;
      }
      
        header { 
           
           color: white;
           padding: 20px;
           text-align: center;
           font: Montserrat,sans-serif;
      }
      
      .btn {
        background: cyan;
        color: white;
        padding: 10px 20px;
        margin-top: 500px;
        display: inline-block;
        border-radius: 10px;
      }
      
      nav {
        text-align: left, center, right;
        margin-bottom: 10px;
      }
      nav a {
        padding: 10px;
        color: black;
        text-decoration: none;
      }
      .one {
        height: 100px;
        width: 100px;
        border: 0px solid black;
        background: red;
        margin-left: 10px;
        animation: roll 2s linear 0.5s infinite alternate both running;
      }
      .two {
        height: 100px;
        width: 100px;
        border: 0px solid black;
        background: yellow;
        margin-left: 10px;
        animation: roll 2s linear 1s infinite alternate both running;
      }
      .three {
        height: 100px;
        width: 100px;
        border: 0px solid black;
        background: green;
        margin-left: 10px;
        animation: roll 2s linear 1.5s infinite alternate both running;
      }
      @keyframes roll {
        from {
          margin-left: 10px;
          transform: rotate(0deg);
        }
        to {
          margin-left: 250px;
          transform: rotate(360deg);
          /*border-radius: 50%;*/
        }
      }
    </style>
  </head>
